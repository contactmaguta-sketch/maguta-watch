<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande reçue — Maguta Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C8A050;--gold-light:#E8C878;--gold-dim:#8B6F35;--green:#4A9A6A;--bg:#F8F5EF;--bg2:#EEE9DF;--text:#1A1A10;--muted:#6A6A5A;--border:rgba(139,111,53,0.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;display:flex;align-items:center;justify-content:center;padding:28px}
.box{max-width:680px;background:var(--bg2);border:1px solid var(--border);padding:56px 36px;text-align:center;position:relative}
.box:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:700;color:var(--gold);letter-spacing:.2em;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(200,160,80,.1);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--gold);letter-spacing:.1em;margin-bottom:32px}
.dot{width:7px;height:7px;background:var(--green);border-radius:50%}
h1{font-family:'Cinzel',serif;font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;letter-spacing:.04em;text-transform:uppercase;margin-bottom:20px}
h1 span{color:var(--gold)}
p{color:var(--muted);font-size:1.15rem;line-height:1.75;max-width:500px;margin:0 auto 32px}
a{background:var(--gold);color:#080A08;border:none;padding:14px 32px;font-family:'Cinzel',serif;font-size:.82rem;font-weight:600;letter-spacing:.1em;border-radius:2px;text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div class="box">
  <div class="logo">MAGUTA WATCH</div>
  <div class="badge"><span class="dot"></span>DEMANDE REÇUE</div>
  <h1>Votre inscription <span>est enregistrée</span></h1>
  <p>Merci. Nous avons bien reçu vos informations. Un premier retour vous sera envoyé par email après analyse de votre secteur et de votre zone géographique.</p>
  <a href="/">RETOUR AU SITE</a>
</div>
</body>
</html>
